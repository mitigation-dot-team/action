name: Security Governance

on:
  pull_request:
    types: [opened, synchronize, reopened]

  push:
    branches:
      - main
      - dev

jobs:
  mitigation-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR Git Diff
        run: |
          base_ref="${{ github.base_ref || 'main' }}"
          git fetch origin "$base_ref"
          git diff "origin/$base_ref...HEAD" > pr_changes.diff

      - name: Run Mitigation
        id: mitigation
        uses: ./
        with:
          api-key: ${{ secrets.MITIGATION_API_KEY  }}
          diff-file: pr_changes.diff
          output-report: report.md
        env:
          TOKEN: ${{ secrets.TOKEN }}

      - name: Decode Report
        id: vars
        shell: bash
        run: |
          decode () {
            printf '%s' "$1" | base64 -d
          }
          markdown="$(decode "${{ steps.mitigation.outputs.report_body }}")"
          EOF_DELIMITER=$(dd if=/dev/urandom bs=15 count=1 2>/dev/null | base64 | tr -dc 'A-Za-z0-9')

          echo "report_body<<$EOF_DELIMITER" >> $GITHUB_ENV
          echo "$markdown" >> $GITHUB_ENV
          echo "$EOF_DELIMITER" >> $GITHUB_ENV

      - name: Post PR comment (create or update)
        if: ${{ steps.mitigation.outputs.report_body != '' && github.event.pull_request.number != '' }}
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          # Usamos "|" para indicarle a YAML que conserve el formato multilínea exacto
          body: |
            ${{ env.report_body }}

      - name: Upload Report Artifacts
        if: ${{ steps.mitigation.outputs.report_body != '' && github.event.pull_request.number != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: mitigation-reports
          path: |
            report.md

