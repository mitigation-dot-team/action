name: Security Governance

on:
  pull_request:
    types: [opened, synchronize, reopened]

  push:
    branches:
      - main
      - dev

jobs:
  mitigation-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Get PR Git Diff
        run: |
          base_ref="${{ github.base_ref || 'main' }}"
          git fetch origin "$base_ref"
          git diff "origin/$base_ref...HEAD" > pr_changes.diff

      - name: Run Mitigation
        uses: ./
        with:
          api-key: ${{ secrets.MITIGATION_API_KEY  }}
          diff-file: pr_changes.diff
        env:
          TOKEN: ${{ secrets.TOKEN }}

      - name: Post PR comment (create or update)
        if: ${{ github.event_name == 'pull_request' && (env.POST_COMMENT == 'true' || env.POST_COMMENT_SECRET == 'true') }}
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.mitigation-scan.outputs.pr_comment_body }}